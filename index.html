<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover, user-scalable=no"
    >

    <title>Arthur & Valder's 67 Kid: Maze Escape</title>

    <meta name="theme-color" content="#111827">

    <meta
        name="apple-mobile-web-app-capable"
        content="yes"
    >

    <meta
        name="apple-mobile-web-app-status-bar-style"
        content="black-translucent"
    >

    <meta
        name="apple-mobile-web-app-title"
        content="67 Kid"
    >

    <link
        rel="stylesheet"
        href="./style.css"
    >

    <link
        rel="manifest"
        href="./manifest.webmanifest"
    >

    <link
        rel="apple-touch-icon"
        sizes="180x180"
        href="./assets/icon-180.png"
    >

    <link
        rel="icon"
        type="image/png"
        sizes="180x180"
        href="./assets/icon-180.png"
    >
</head>

<body>
    <main class="game-container">
        <header>
            <div id="toilet-personality" class="toilet-personality hidden">
    <div class="personality-card">
        <div id="personality-name" class="personality-name"></div>
        <div id="personality-description" class="personality-description"></div>

        <button id="start-escape-button">
            LET'S ESCAPE!
        </button>
    </div>
</div>
            <h1>
                <span>Arthur & Valder's 67 Kid:</span>
                Maze Escape
            </h1>

            <div class="header-actions">
                <div id="stars-display">
                    ⭐ 0
                </div>

                <button
                    id="gallery-button"
                    class="secondary-button"
                >
                    Gallery
                </button>

                <div id="timer">
                    Time: 0.0
                </div>
            </div>
        </header>

        <div class="canvas-container">
            <canvas
                id="game"
                width="960"
                height="640"
            ></canvas>

            <div
                id="overlay"
                class="overlay hidden"
            >
                <div class="message-box">
                    <h2 id="message-title">
                        Game Over
                    </h2>

                    <p id="message-text"></p>

                    <p
                        id="star-message"
                        class="star-message hidden"
                    ></p>

                    <p
                        id="unlock-message"
                        class="unlock-message hidden"
                    ></p>

                    <button id="restart-button">
                        Play Again
                    </button>
                </div>
            </div>
        </div>

        <div class="touch-controls">
            <div class="touch-side touch-left">
                <button
                    data-dir="up"
                    aria-label="Move up"
                >
                    ▲
                </button>

                <button
                    data-dir="left"
                    aria-label="Move left"
                >
                    ◀
                </button>

                <button
                    data-dir="down"
                    aria-label="Move down"
                >
                    ▼
                </button>
            </div>

            <div class="touch-side touch-right">
                <button
                    data-dir="up"
                    aria-label="Move up"
                >
                    ▲
                </button>

                <button
                    data-dir="right"
                    aria-label="Move right"
                >
                    ▶
                </button>

                <button
                    data-dir="down"
                    aria-label="Move down"
                >
                    ▼
                </button>
            </div>
        </div>

        <p class="instructions">
            Arrow keys/WASD on computer. Touch controls on iPad.
            Press R for a new maze.
        </p>
    </main>

    <section
        id="gallery-screen"
        class="gallery-screen hidden"
    >
        <div class="gallery-panel">
            <div class="gallery-header">
                <div>
                    <h2>Holiday Gallery</h2>
                    <p id="gallery-progress"></p>
                    <p id="gallery-stars"></p>
                </div>

                <button
                    id="close-gallery-button"
                    class="secondary-button"
                >
                    Close
                </button>
            </div>

            <div
                id="gallery-grid"
                class="gallery-grid"
            ></div>
        </div>
    </section>

    <section
        id="photo-viewer"
        class="photo-viewer hidden"
    >
        <button
            id="close-photo-button"
            class="photo-close-button"
        >
            ×
        </button>

        <img
            id="large-photo"
            alt="Unlocked holiday memory"
        >

        <h2 id="large-photo-title"></h2>
        <p id="large-photo-caption"></p>
    </section>

    <script
        type="module"
        src="./src/game.js"
    ></script>
</body>
</html>
